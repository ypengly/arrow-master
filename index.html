<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10131c" />
  <title>Arrow Master</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131c; overflow: hidden; touch-action: none;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; font-family: 'Trebuchet MS', Arial, sans-serif; }
    #game { width: 100vw; height: 100vh; height: 100dvh; }
    canvas { display: block; touch-action: none; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #10131c; color: #ffd35a;
      align-items: center; justify-content: center; text-align: center; font-size: 22px; padding: 24px; flex-direction: column; gap: 12px; }
    #rotate b { font-size: 46px; }
    @media (orientation: portrait) and (max-width: 600px) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><b>&#8635;</b><span>Rotate your device to landscape<br/>to play Arrow Master</span></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
